version: 2.1
defaults: &defaults
  docker:
    - image: 'cimg/node:18.12.1'
jobs:
  release:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: install
          command: yarn install
      - run:
          name: release
          command: yarn semantic-release || true
workflows:
  master:
    jobs:
      - release:
          context: devops-dev
          filters:
            branches:
              only:
                - master
